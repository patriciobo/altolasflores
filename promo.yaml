description: >-
  Complejo de cabañas en una zona tranquila de Santa Rosa de Calamuchita, con fácil acceso a compras
  diarias, restaurantes y el centro de la ciudad. Cabañas de dos plantas con cocina equipada, comedor,
  habitación matrimonial y habitación con cuchetas, Wi-Fi y televisión en todas las cabañas. Parque
  amplio con pileta, sombrillas de paja, parrilla y juegos para chicos. A 5 minutos de la playa Mate de
  Luna, 15 del centro de Santa Rosa, 20 de Villa General Belgrano y 25 de Villa Yacanto. Las consultas y
  reservas se hacen por WhatsApp.
